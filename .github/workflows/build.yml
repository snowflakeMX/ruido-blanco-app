name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to exact commits, so a compromised tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0

      - name: Test core logic
        run: ./gradlew -p core test

      - name: Test screens
        id: screens
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintRelease

      - name: Build APK
        run: ./gradlew :app:assembleRelease

      - name: Report what the APK contains
        run: |
          mkdir -p report
          APK=app/build/outputs/apk/release/app-release.apk
          ls -l $APK | tee report/apk.txt
          cp app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml report/ 2>/dev/null \
            || find app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*release*' -exec cp {} report/ \; -quit
          grep -o 'uses-permission[^>]*name="[^"]*"' report/AndroidManifest.xml | tee report/permissions.txt || true
          cp app/build/reports/lint-results-release.txt report/ 2>/dev/null || true
          cp app/build/test-results/testDebugUnitTest/*.xml report/ 2>/dev/null || true
          cp app/build/outputs/apk/release/app-release.apk ruido-blanco-${{ github.run_number }}.apk

      # Screenshots and reports go to the "capturas" branch, to review them without downloading artifacts.
      - name: Publish screenshots and reports
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          rm -rf /tmp/capturas && mkdir -p /tmp/capturas
          cp -r app/build/capturas/. /tmp/capturas/ 2>/dev/null || true
          cp -r report/. /tmp/capturas/ 2>/dev/null || true
          echo "Compilación ${{ github.run_number }} · ${{ github.event.pull_request.head.sha || github.sha }}" > /tmp/capturas/README.md
          cd /tmp/capturas
          git init -q -b capturas
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Capturas de la compilación ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas

      - name: Fail if screen tests failed
        if: steps.screens.outcome == 'failure'
        run: exit 1

      # A fixed "ultima" release, so the phone can always download the newest APK from one link.
      - name: Publish latest APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima ruido-blanco-*.apk \
            --target "${{ github.event.pull_request.head.sha || github.sha }}" \
            --title "Última versión (compilación ${{ github.run_number }})" \
            --notes "Rama ${{ github.head_ref || github.ref_name }}. Descargá el APK y abrilo en el teléfono para instalarlo." \
            --prerelease
