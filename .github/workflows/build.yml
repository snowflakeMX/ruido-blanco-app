name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test core logic
        run: ./gradlew -p core test

      - name: Build APK
        run: ./gradlew :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ruido-blanco-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ruido-blanco-apk
          path: ruido-blanco-*.apk

      # A fixed "ultima" release, so the phone can always download the newest APK from one link.
      - name: Publish latest APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima ruido-blanco-*.apk \
            --target "${{ github.event.pull_request.head.sha || github.sha }}" \
            --title "Última versión (compilación ${{ github.run_number }})" \
            --notes "Rama ${{ github.head_ref || github.ref_name }}. Descargá el APK y abrilo en el teléfono para instalarlo." \
            --prerelease
